# =====================================================
# School Management System - Application Config
# =====================================================

spring.application.name=School-Management
server.port=8080

# ===== Database (PostgreSQL) =====
#spring.datasource.url=jdbc:postgresql://localhost:5432/dps_school_db
#spring.datasource.username=postgres
#spring.datasource.password=postgres
#spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/school_db
spring.datasource.username=root
spring.datasource.password=root

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ===== Jackson =====
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ===== JWT =====
app.jwt.secret=dps-school-management-secret-key-2025-enterprise-grade-system-secure-token
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ===== File Upload =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=./uploads

# ===== CORS =====
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ===== Mail (disabled until configured with real credentials) =====
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=
#spring.mail.password=
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.health.mail.enabled=false

# ===== Exclude Mail AutoConfig (no SMTP server configured) =====
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# ===== Logging =====
logging.level.com.sms.school=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===== Virtual Threads =====
spring.threads.virtual.enabled=true
